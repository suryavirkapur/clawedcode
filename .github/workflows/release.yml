name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aarch64-linux
          # Use an Intel runner for x86_64 builds to avoid relying on cross-compilation.
          - os: macos-13
            target: x86_64-apple-darwin
            name: x86_64-darwin
          # Use an Apple Silicon runner for aarch64 builds.
          - os: macos-14
            target: aarch64-apple-darwin
            name: aarch64-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: aarch64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cross build --locked --release --target ${{ matrix.target }} -p clawedcode

      - name: Build
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --locked --release --target ${{ matrix.target }} -p clawedcode

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/clawedcode${{ matrix.os == 'windows-latest' && '.exe' || '' }}" "dist/clawedcode-${{ matrix.name }}"

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clawedcode-${{ matrix.name }}
          tag_name: ${{ github.ref_name }}
