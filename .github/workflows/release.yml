name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aarch64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            name: x86_64-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: aarch64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p clawedcode

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/clawedcode${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          tag_name: ${{ github.ref_name }}
