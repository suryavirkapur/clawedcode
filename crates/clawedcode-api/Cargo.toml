[package]
name = "clawedcode-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "API layer for clawedcode"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-core.workspace = true
futures-util.workspace = true
pin-project-lite.workspace = true
# Use Rustls TLS so our Linux-musl release builds don't need system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"], optional = true }
clawedcode-mcp = { path = "../clawedcode-mcp", version = "0.1.0" }
clawedcode-tools = { path = "../clawedcode-tools", version = "0.1.0" }

[features]
default = []
anthropic = ["dep:reqwest"]
