[package]
name = "clawedcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A coding agent shell focused on startup speed, terminal UX, and compatibility"
license.workspace = true
repository.workspace = true
readme.workspace = true
default-run = "clawedcode"

[dependencies]
anyhow.workspace = true
atty = "0.2"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
clawedcode-api = { path = "../clawedcode-api", version = "0.0.3", features = ["anthropic"] }
clawedcode-core = { path = "../clawedcode-core", version = "0.0.3" }
clawedcode-mcp = { path = "../clawedcode-mcp", version = "0.0.3" }
clawedcode-tui = { path = "../clawedcode-tui", version = "0.0.3" }
clawedcode-tools = { path = "../clawedcode-tools", version = "0.0.3" }

[[bin]]
name = "clawedcode"
path = "src/main.rs"
